name: ci

# Runs on every push and pull request, including branches. Until this existed,
# nothing ran the test suite: release-windows built and published without ever
# invoking `go test`, so a broken test could ship.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows, not Linux, for two reasons:
    #  - the walk GUI package is //go:build windows, so `go build ./...` has no
    #    main function for cmd/digi-erp-connector anywhere else and fails
    #  - the config and secrets tests exercise the PROGRAMDATA data-dir layout
    #    and DPAPI, and skip themselves on other platforms
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # .gitattributes pins .go files to LF, so a CRLF checkout can no longer
      # make every file look unformatted.
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ./cmd ./internal"
            exit 1
          fi
          echo "gofmt clean"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -count=1 so a warm build cache can never mask a failure. -v so the log
      # shows which tests ran and which skipped (a PR can cite them); the next
      # step repeats just the failures, so they stay readable.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log

      - name: Test failures
        if: failure()
        shell: bash
        run: grep -E -B2 -A25 -- '^\s*--- FAIL' test.log || true

      # Only a release compiled the installer before: a Pascal error in the .iss
      # surfaced after the merge to main, as a failed public release. Compile it
      # here too, with the same defines (the binaries are unstamped dev builds).
      - name: Build the installer's executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          # the release's flags, stamped with this commit: a test install says which build it runs
          v="-X github.com/digitrade-e/digi-erp-connector/internal/buildinfo.Version=v0.0.0-ci.${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -H=windowsgui $v" -o dist/bin/digi-erp-connector.exe ./cmd/digi-erp-connector
          go build -trimpath -ldflags "-s -w $v" -o dist/bin/digi-erp-connectord.exe ./cmd/digi-erp-connectord
          go build -trimpath -ldflags "-s -w $v" -o dist/bin/digi-erp-connector-provision.exe ./cmd/digi-erp-connector-provision
          go build -trimpath -ldflags "-s -w $v" -o dist/bin/digi-erp-connector-link.exe ./cmd/digi-erp-connector-link
          (cd dist/bin && sha256sum *.exe > ../SHA256SUMS)

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # As in release-windows.yml (plan 086 review m11): the link's upgrade runs the setup as LocalSystem, and Inno Setup
      # 6.5.0+ gives it a private temporary folder there (GetTempPath2: C:\Windows\SystemTemp). The version is the one
      # the compiler reports while it compiles (iscc on PATH is Chocolatey's shim, whose file says 0.0.0.0).
      - name: Compile the installer
        shell: powershell
        run: |
          $out = & iscc /DAppVersion=0.0.0 /DBuildDir="$PWD\\dist\\bin" /DOutputDir="$PWD\\dist" assets\\installer\\digi-erp-connector.iss
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
          $m = [regex]::Match(($out -join "`n"), 'Compiler engine version: Inno Setup (\d+\.\d+\.\d+)')
          if (-not $m.Success) { Write-Error "the compiler did not report its version"; exit 1 }
          $v = [version]$m.Groups[1].Value
          if ($v -lt [version]'6.5.0') { Write-Error "Inno Setup $v is older than 6.5.0: no private temporary folder under LocalSystem"; exit 1 }
          Write-Host "Inno Setup $v (at least 6.5.0)"

      # A branch's installer, kept 14 days, for a test install before anything is released (plan 083: link-test-N).
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            dist/digi-erp-connector-setup-*.exe
            dist/SHA256SUMS
          retention-days: 14
