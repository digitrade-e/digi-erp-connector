name: release-windows

on:
  workflow_run:
    workflows:
      - "auto-tag"
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag=$(git tag --points-at HEAD | head -n 1)
          if [ -z "$tag" ]; then
            echo "No tag found on HEAD."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Gate: never publish a release built from code that does not vet or pass
      # its tests. This job already runs on windows-latest, which is where the
      # GUI package and the DPAPI/PROGRAMDATA tests can actually run.
      #
      # Note the tag is created by auto-tag before this job starts, so a failure
      # here leaves a tag with no release attached. That is intentional — better
      # a dangling tag than a published installer nobody tested.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Install Inno Setup
        run: choco install innosetup -y

      # The upgrade over the link runs this setup as LocalSystem (plan 086 review m11). Inno Setup 6.5.0 and later put
      # its temporary folder in the private C:\Windows\SystemTemp there (GetTempPath2), not the C:\Windows\Temp users
      # can create entries in; 6.3.0 hardened DLL preloading. The runner image ships a current one (6.7.1 on
      # 2026-11-16); this refuses an older one instead of pinning, so the image's fixes keep coming.
      - name: Check the Inno Setup version
        shell: powershell
        run: |
          $cmd = Get-Command iscc -ErrorAction Stop
          $raw = $cmd.FileVersionInfo.ProductVersion
          if (-not $raw) { $raw = $cmd.FileVersionInfo.FileVersion }
          $v = [version](($raw.Trim() -split '[^0-9.]')[0])
          Write-Host "Inno Setup $v ($($cmd.Source))"
          if ($v -lt [version]'6.5.0') { Write-Error "Inno Setup $v is older than 6.5.0: no private temporary folder under LocalSystem"; exit 1 }

      - name: Build Windows executables
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          # Stamp the release tag into the binaries; GET /api/ping returns it as
          # "version" ("dev" in any build without this).
          version_flag="-X github.com/digitrade-e/digi-erp-connector/internal/buildinfo.Version=${VERSION}"
          go build -trimpath -ldflags "-s -w -H=windowsgui ${version_flag}" -o "dist/bin/digi-erp-connector.exe" ./cmd/digi-erp-connector
          go build -trimpath -ldflags "-s -w ${version_flag}" -o "dist/bin/digi-erp-connectord.exe" ./cmd/digi-erp-connectord
          # A console program: it prints one JSON object (plan 068).
          go build -trimpath -ldflags "-s -w ${version_flag}" -o "dist/bin/digi-erp-connector-provision.exe" ./cmd/digi-erp-connector-provision
          # The link service (plan 083): dials out to Digitrade's relay; the installer ships it.
          go build -trimpath -ldflags "-s -w ${version_flag}" -o "dist/bin/digi-erp-connector-link.exe" ./cmd/digi-erp-connector-link
          # digi-mcp runs these over WinRM only when their sha256 is listed in a
          # release's SHA256SUMS (plan 068, lint L25); the link's `version` answer
          # is checked against the same file (plan 083 P3).
          (cd dist/bin && sha256sum digi-erp-connector.exe digi-erp-connectord.exe digi-erp-connector-provision.exe digi-erp-connector-link.exe > ../SHA256SUMS)

      - name: Build installer
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          $appVersion = $env:VERSION.TrimStart("v")
          iscc /DAppVersion=$appVersion /DBuildDir="$PWD\\dist\\bin" /DOutputDir="$PWD\\dist" assets\\installer\\digi-erp-connector.iss

      # The upgrade over the link (plan 086 D2) runs a setup only when this release's SHA256SUMS lists it with the
      # digest the signed envelope pins: add the installer's line now that it exists. Its name is the one the link
      # composes (internal/link/upgrade.go setupFile): digi-erp-connector-setup-<version>.exe.
      - name: List the installer in SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum digi-erp-connector-setup-*.exe >> SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/digi-erp-connector-setup-*.exe
            dist/SHA256SUMS
          generate_release_notes: true
