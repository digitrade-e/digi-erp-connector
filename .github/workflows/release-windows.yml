name: release-windows

on:
  workflow_run:
    workflows:
      - "auto-tag"
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag=$(git tag --points-at HEAD | head -n 1)
          if [ -z "$tag" ]; then
            echo "No tag found on HEAD."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Gate: never publish a release built from code that does not vet or pass
      # its tests. This job already runs on windows-latest, which is where the
      # GUI package and the DPAPI/PROGRAMDATA tests can actually run.
      #
      # Note the tag is created by auto-tag before this job starts, so a failure
      # here leaves a tag with no release attached. That is intentional — better
      # a dangling tag than a published installer nobody tested.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows executables
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "dist/bin/digi-erp-connector.exe" ./cmd/digi-erp-connector
          go build -trimpath -ldflags "-s -w" -o "dist/bin/digi-erp-connectord.exe" ./cmd/digi-erp-connectord

      - name: Build installer
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          $appVersion = $env:VERSION.TrimStart("v")
          iscc /DAppVersion=$appVersion /DBuildDir="$PWD\\dist\\bin" /DOutputDir="$PWD\\dist" assets\\installer\\digi-erp-connector.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/digi-erp-connector-setup-*.exe
          generate_release_notes: true
